#
# Tag a merge to main (semver), then build and publish the container image to
# Artifact Registry. Flux image automation in deploy-production-apps
# (ImageRepository europe-docker.pkg.dev/invopop/apps/gobl.lookup) picks up the
# new tag and rolls the deployment.
#
# Repository secrets required:
#  * GCP_PROJECT_ID - Google Cloud project of the Artifact Registry (invopop)
#  * GCP_SA_KEY     - JSON service account key with artifactregistry.writer on
#                     the `apps` repository
#
# gobl.lookup has only public Go modules, so no GO_MOD_USER/GO_MOD_PASS is
# needed (unlike the private-module services).
#

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write # the tag action pushes a new tag

env:
  REGISTRY: europe-docker.pkg.dev
  REPO_PATH: invopop/apps

jobs:
  tag-build-publish:
    name: Tag, Build, Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: "0" # make sure we get all commits!

      - name: Get repo details
        run: |
          echo "COMMIT_TYPE=$(echo $GITHUB_REF | cut -d / -f 2)" >> $GITHUB_ENV
          echo "REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d / -f 2-)" >> $GITHUB_ENV
          echo "REPO_VERSION=$(echo $GITHUB_REF | cut -d / -f 3-)" >> $GITHUB_ENV

      - name: Bump version and push tag
        id: bump
        if: env.COMMIT_TYPE != 'tags'
        uses: anothrNick/github-tag-action@1.52.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCHES: main
          WITH_V: true

      - name: Set Version from Semver Tag
        if: env.COMMIT_TYPE != 'tags'
        run: |
          echo "REPO_VERSION=${{ steps.bump.outputs.new_tag }}" >> $GITHUB_ENV

      - name: Google Auth
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker Credentials
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build
        run: |
          docker build -t ${{ env.REPO_NAME }} \
            --build-arg VERSION=${{ env.REPO_VERSION }} \
            --build-arg DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            .

      - name: Tag Image
        run: |
          docker image tag ${{ env.REPO_NAME }} ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}:${{ env.REPO_VERSION }}

      - name: Tag Latest Main Release
        if: env.COMMIT_TYPE != 'tags'
        run: |
          docker image tag ${{ env.REPO_NAME }} ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}:latest

      - name: Publish
        run: |
          docker image push --all-tags ${{ env.REGISTRY }}/${{ env.REPO_PATH }}/${{ env.REPO_NAME }}
